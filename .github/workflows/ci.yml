name: Examples and tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows / Daslang 0.6.5-RC2
    runs-on: windows-2022
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install pinned Daslang SDK
        id: sdk
        run: |
          $exe = & ./.github/scripts/install-daslang.ps1 -Destination (Join-Path $env:RUNNER_TEMP 'daslang-0.6.5-RC2')
          "DASLANG_EXE=$exe" >> $env:GITHUB_ENV

      - name: Type providers / interpreter examples and tests
        if: ${{ !cancelled() && steps.sdk.outcome == 'success' }}
        run: |
          # Nonzero native exits are expected in negative compiler tests.
          $PSNativeCommandUseErrorActionPreference = $false
          New-Item -ItemType Directory -Path ci-results -Force | Out-Null
          Start-Transcript -Path ci-results/type-providers.log
          try { & ./type_providers/run.ps1 -Test }
          finally { Stop-Transcript }

      - name: Computation expressions / interpreter examples and tests
        if: ${{ !cancelled() && steps.sdk.outcome == 'success' }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          Start-Transcript -Path ci-results/computation-expressions.log
          try { & ./computation_expressions/run_computation.ps1 -Test }
          finally { Stop-Transcript }

      - name: Active patterns / interpreter and JIT
        if: ${{ !cancelled() && steps.sdk.outcome == 'success' }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          Start-Transcript -Path ci-results/active-patterns.log
          try {
            & ./active_patterns/run.ps1 -Test
            & ./active_patterns/run.ps1 -Test -Jit
          } finally { Stop-Transcript }

      - name: ReactiveX / interpreter and JIT
        if: ${{ !cancelled() && steps.sdk.outcome == 'success' }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          Start-Transcript -Path ci-results/reactivex.log
          try {
            & ./reactivex/run.ps1 -Test
            & ./reactivex/run.ps1 -Test -Jit
          } finally { Stop-Transcript }

      - name: CE / JIT regression subset
        if: ${{ !cancelled() && steps.sdk.outcome == 'success' }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          & ./computation_expressions/run_modes.ps1 -Mode Jit -OutputDirectory "$env:GITHUB_WORKSPACE/ci-results/jit"

      - name: CE / AOT C++ generation (no runtime execution)
        if: ${{ !cancelled() && steps.sdk.outcome == 'success' }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          & ./computation_expressions/run_modes.ps1 -Mode AotGenerate -OutputDirectory "$env:GITHUB_WORKSPACE/ci-results/aot-generation"

      - name: Task / real TCP and peer closure (JIT)
        if: ${{ !cancelled() && steps.sdk.outcome == 'success' }}
        run: |
          & ./computation_expressions/test_task_tcp.ps1 -Jit

      - name: Task / dasHV WebSocket and peer closure (JIT)
        if: ${{ !cancelled() && steps.sdk.outcome == 'success' }}
        run: |
          & ./computation_expressions/test_task_hv.ps1 -Jit
          & ./computation_expressions/test_task_hv.ps1 -AndBind -Jit

      - name: Task / HTTP requests over jobque and dasHV (interpreter and JIT)
        if: ${{ !cancelled() && steps.sdk.outcome == 'success' }}
        run: |
          & ./computation_expressions/test_task_http.ps1
          & ./computation_expressions/test_task_http.ps1 -Jit

      - name: Task / event subscriptions (JIT)
        if: ${{ !cancelled() && steps.sdk.outcome == 'success' }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          & $env:DASLANG_EXE ./computation_expressions/tests/test_task_events.das -no-module-cache -jit -jit-no-cache
          if ($LASTEXITCODE -ne 0) { throw 'Task event JIT checks failed' }
          & $env:DASLANG_EXE ./computation_expressions/examples/task_events_demo.das -no-module-cache -jit -jit-no-cache
          if ($LASTEXITCODE -ne 0) { throw 'Task event JIT example failed' }
          & ./computation_expressions/test_task_keyboard.ps1 -Jit

      - name: Task / GLFW keyboard callbacks and cleanup (JIT)
        if: ${{ !cancelled() && steps.sdk.outcome == 'success' }}
        run: |
          & ./computation_expressions/test_task_glfw_keyboard.ps1 -Jit

      - name: ReactiveX / GLFW UI and cancellable WebSocket stream (JIT)
        if: ${{ !cancelled() && steps.sdk.outcome == 'success' }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          Start-Transcript -Path ci-results/reactivex-integrations.log
          try { & ./reactivex/test_integrations.ps1 -Jit }
          finally { Stop-Transcript }

      - name: Task, AsyncSequence and domain builders / build and execute strict AOT host
        if: ${{ !cancelled() && steps.sdk.outcome == 'success' }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          & ./computation_expressions/run_aot.ps1 -OutputDirectory "$env:GITHUB_WORKSPACE/ci-results/aot-runtime" -BuildDirectory "$env:RUNNER_TEMP/ce-task-aot-build"

      - name: Upload test logs and mode reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-daslang-0.6.5-rc2-results
          path: ci-results/
          if-no-files-found: warn
          retention-days: 14

  reactivex-aot:
    name: ReactiveX / AOT runtime / Daslang 0.6.5-RC2
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install pinned Daslang SDK
        run: |
          $exe = & ./.github/scripts/install-daslang.ps1 -Destination (Join-Path $env:RUNNER_TEMP 'daslang-0.6.5-RC2')
          "DASLANG_EXE=$exe" >> $env:GITHUB_ENV

      - name: ReactiveX / build and execute all examples and positive tests
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          New-Item -ItemType Directory -Path ci-results -Force | Out-Null
          Start-Transcript -Path ci-results/reactivex-aot-build.log
          try {
            & ./reactivex/run_aot.ps1 -OutputDirectory "$env:GITHUB_WORKSPACE/ci-results/reactivex-aot-runtime" -BuildDirectory "$env:RUNNER_TEMP/reactivex-aot-build"
          } finally { Stop-Transcript }

      - name: Upload AOT build and runtime reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: reactivex-aot-runtime-results
          path: ci-results/
          if-no-files-found: warn
          retention-days: 14

  reactivex-native-aot:
    name: ReactiveX / GLFW and HV AOT runtime / Daslang 0.6.5-RC2
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install pinned Daslang SDK
        run: |
          $exe = & ./.github/scripts/install-daslang.ps1 -Destination (Join-Path $env:RUNNER_TEMP 'daslang-0.6.5-RC2')
          "DASLANG_EXE=$exe" >> $env:GITHUB_ENV

      - name: Build and execute GLFW and HV integrations with strict AOT
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          New-Item -ItemType Directory -Path ci-results -Force | Out-Null
          Start-Transcript -Path ci-results/reactivex-native-aot-build.log
          try {
            & ./reactivex/run_integrations_aot.ps1 -OutputDirectory "$env:GITHUB_WORKSPACE/ci-results/reactivex-native-aot" -BuildDirectory "$env:RUNNER_TEMP/reactivex-native-aot-build"
          } finally { Stop-Transcript }

      - name: Upload native AOT build and runtime reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: reactivex-native-aot-results
          path: ci-results/
          if-no-files-found: warn
          retention-days: 14
